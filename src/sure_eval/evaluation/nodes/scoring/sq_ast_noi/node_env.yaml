id: scoring/sq_ast_noi
group: se-no-reference
runtime:
  type: pip
  optional: true
  gpu: optional
packages:
  - name: torch
    version: "==2.2.0"
  - name: torchaudio
    version: "==2.2.0"
  - name: transformers
    version: "==4.40.2"
models:
  - id: sq-ast/noi.pth
    provider: manual
    source: https://tubcloud.tu-berlin.de/s/K9owXP3Fnj4pnJg
    target: checkpoints/weights/noi.pth
    env: SURE_SE_SQ_AST_NOI_CKPT
    license: unknown
    sha256: 2ab8639274c1b8f2099833d6992ca8bf5cec99740bb9c3ddb7c223d8a7bcb23e
  - id: MIT/ast-finetuned-audioset-10-10-0.4593
    provider: manual
    source: https://huggingface.co/MIT/ast-finetuned-audioset-10-10-0.4593
    revision: f826b80d28226b62986cc218e5cec390b1096902
    target: checkpoints/ast-base
    env: SURE_SE_SQ_AST_BASE_MODEL_DIR
    license: bsd-3-clause
verify:
  imports: [torch, torchaudio, transformers]
  files:
    - path: noi.pth
      relative_to_env: SURE_SE_SQ_AST_NOI_CKPT
      default_base: checkpoints/weights
    - path: config.json
      relative_to_env: SURE_SE_SQ_AST_BASE_MODEL_DIR
      default_base: checkpoints/ast-base
    - path: preprocessor_config.json
      relative_to_env: SURE_SE_SQ_AST_BASE_MODEL_DIR
      default_base: checkpoints/ast-base
    - path: model.safetensors
      relative_to_env: SURE_SE_SQ_AST_BASE_MODEL_DIR
      default_base: checkpoints/ast-base
