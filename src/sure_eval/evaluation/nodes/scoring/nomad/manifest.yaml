id: scoring/nomad
version: v1
stage: scoring
language_sensitive: false
input_schema: enhanced_audio_rows
output_schema: non_matching_reference_audio_metric
implementation: sure_eval.evaluation.nodes.scoring.nomad.node
metric: nomad
backend: nomad_audio-0.0.8
internal_stages:
  - audio_score_provider
  - score_normalization
  - mean_aggregation
used_by:
  - SE non-matching-reference speech enhancement quality
notes:
  - NOMAD is a perceptual embedding distance; lower is better.
  - Scores use the mean distance to a staged clean non-matching reference pool.
  - The reference pool must be held fixed across a benchmark report.
